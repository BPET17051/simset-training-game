<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission layout verification</title>
<style>
  body { margin:0; font:14px sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
  nav { position:fixed; top:0; left:0; z-index:10; background:white; padding:4px; }
</style>
<iframe title="Training game"></iframe>
<nav>
  <label>Frame <select id="frame"></select></label>
  <button id="show">Show frame</button>
  <button id="check">Check frame</button>
  <button id="check-all">Check all frames</button>
  <button id="hide">Hide controls</button>
  <output id="result">Loading</output>
</nav>
<script>
  const game = document.querySelector('iframe');
  const result = document.querySelector('#result');
  // This harness is for local QA, not a second production entry point.
  if (['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
    game.src = '../index.html';
  } else {
    result.textContent = 'Local verification only';
    document.querySelectorAll('button').forEach(button => button.disabled = true);
  }
  document.querySelector('#hide').onclick = () => document.querySelector('nav').hidden = true;
  let sceneError = null;
  function scene(frame) {
    const win = game.contentWindow;
    if (!win.exportRoot || !win.stage) return false;
    const originalTimeout = win.setTimeout;
    const originalRoot = win.root;
    sceneError = null;
    try {
      // Direct frame inspection intentionally bypasses the game's normal path.
      // Isolate layout rendering from path-dependent globals and video timers.
      win.root = win.exportRoot;
      win.setTimeout = () => 0;
      if (frame !== 26) win.document.querySelector('#end_training_notice')?.remove();
      win.exportRoot.gotoAndStop(frame);
      win.stage.update();
      result.textContent = 'Frame ' + win.exportRoot.currentFrame;
      return true;
    } catch (error) {
      sceneError = error;
      return false;
    } finally {
      win.setTimeout = originalTimeout;
      if (originalRoot === undefined) delete win.root;
      else win.root = originalRoot;
    }
  }
  function inspect(frame) {
    const win = game.contentWindow;
    const foreground = win.document.querySelector('#canvas').getBoundingClientRect();
    const bg = win.document.querySelector('#mission_background');
    const background = bg.getBoundingClientRect();
    const fits = foreground.left >= -1 && foreground.top >= -1 &&
      foreground.right <= win.innerWidth + 1 && foreground.bottom <= win.innerHeight + 1;
    const covers = bg.style.display === 'block' && Math.abs(background.left) < 1 &&
      Math.abs(background.top) < 1 && Math.abs(background.width - win.innerWidth) < 1 &&
      Math.abs(background.height - win.innerHeight) < 1;
    const transparent = win.canvas.style.backgroundColor === 'transparent' &&
      win.document.querySelector('#animation_container').style.backgroundColor === 'transparent';
    const introFrame = [1, 3, 12, 14, 18, 20].includes(frame);
    const video = win.document.querySelector('video.an-video-bg');
    const videoRect = video?.getBoundingClientRect();
    const videoStyle = video && win.getComputedStyle(video);
    const videoVisible = Boolean(videoRect && videoStyle.display !== 'none' &&
      videoStyle.visibility !== 'hidden' && Number(videoStyle.opacity) !== 0 &&
      videoRect.width > 0 && videoRect.height > 0);
    const videoCovers = !introFrame || Boolean(videoVisible && videoRect.left <= 1 &&
      videoRect.top <= 1 && videoRect.right >= win.innerWidth - 1 &&
      videoRect.bottom >= win.innerHeight - 1);
    return { frame, fits, covers, transparent, videoCovers,
      pass: fits && covers && transparent && videoCovers };
  }
  const frameSelect = document.querySelector('#frame');
  for (let frame = 0; frame < 27; frame++) {
    const option = document.createElement('option');
    option.value = frame;
    option.textContent = frame;
    frameSelect.append(option);
  }
  document.querySelector('#show').onclick = () => scene(Number(frameSelect.value));
  document.querySelector('#check').onclick = () => {
    const frame = Number(frameSelect.value);
    if (!scene(frame)) return;
    const check = inspect(frame);
    result.textContent = `${check.pass ? 'PASS' : 'FAIL'} frame ${frame}`;
  };
  document.querySelector('#check-all').onclick = async () => {
    const win = game.contentWindow;
    if (!win.exportRoot || !win.stage) return;
    const checks = [];
    for (let frame = 0; frame < win.exportRoot.totalFrames; frame++) {
      if (!scene(frame)) {
        checks.push({ frame, pass: false, error: String(sceneError) });
        continue;
      }
      // Allow DOM video widgets to finish attach/detach observers before the
      // next synthetic jump; real users never traverse frames this quickly.
      await new Promise(resolve => setTimeout(resolve, 400));
      checks.push(inspect(frame));
    }
    const failures = checks.filter(check => !check.pass);
    result.value = failures.length
      ? `FAIL ${failures.map(check => check.frame + (check.error ? ': ' + check.error : '')).join(', ')}`
      : `PASS ${checks.length}/${checks.length}`;
  };
</script>
</html>
