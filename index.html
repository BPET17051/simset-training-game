<style>
  html, body {
	height:100%;
	overflow:hidden;
	background:#000;
  }
  /* ponytail: static blurred backdrop, not a live canvas capture - simplest fix that still
     eliminates the plain black margin. Revisit if letterbox margins ever grow large enough
     for the static blur to look obviously mismatched vs. the live game content. Relies on
     plain DOM order (this div comes before #animation_container, no z-index) since z-index
     on a fixed-position pseudo-element under a non-positioned body escapes to the root
     stacking context unpredictably - confirmed by testing, not assumed. */
  #ambient_bg {
	position:fixed;
	inset:-40px;
	background:url("Assets/bg.jpg") center/cover no-repeat;
	filter: blur(30px) brightness(0.45);
  }
  #animation_container {
	position:fixed;
	margin:auto;
	left:0;right:0;
	top:0;bottom:0;
  }
  #rotate_prompt {
	display:none;
  }
  @media (orientation:portrait) and (max-width:900px) {
	#animation_container { display:none; }
	#rotate_prompt {
	  display:flex;
	  position:fixed;
	  inset:0;
	  background:#000;
	  color:#fff;
	  flex-direction:column;
	  align-items:center;
	  justify-content:center;
	  text-align:center;
	  font-family:'Google Sans', Tahoma, sans-serif;
	  padding:32px;
	  box-sizing:border-box;
	  z-index:1000;
	}
	#rotate_prompt .icon { font-size:64px; transform:rotate(90deg); margin-bottom:16px; }
	#rotate_prompt p { font-size:20px; line-height:1.6; margin:0; }
  }
  #loading_screen {
	position:fixed;
	inset:0;
	z-index:2000;
	background:#000 url("Assets/bg.jpg") center/cover no-repeat;
	display:flex;
	flex-direction:column;
	align-items:center;
	justify-content:center;
	box-sizing:border-box;
	font-family:'Google Sans', Tahoma, sans-serif;
	color:#fff;
	text-align:center;
	padding:24px;
  }
  #loading_screen::before {
	content:"";
	position:absolute;
	inset:0;
	background:rgba(0,0,0,0.6);
  }
  #loading_screen > * { position:relative; }
  #title_logo { width:min(560px,85vw); height:auto; margin-bottom:24px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6)); }

  #loading_bar_track { width:min(400px,70vw); height:10px; border-radius:6px; background:rgba(255,255,255,0.25); overflow:hidden; }
  #loading_bar { height:100%; width:0%; background:#4CAF50; transition:width 0.15s ease-out; }
  #loading_pct { font-size:14px; margin-top:8px; opacity:0.85; }

<script>
function LoadGFonts(families, comp) {				
	var lib=comp.getLibrary();				
	var googleObject = {type: "Google", loadedFonts: 0, totalFonts: families.length, callOnLoad: lib.gfontAvailable};				
	for(var i =0; i < families.length; i++)				
		isFontAvailable(gFontsFamilies[i], googleObject);				
}
function isFontAvailable(font, obj) {				
	var timeOut = 5000;				
	var delay = 200;				
	var interval = 0;				
	var timeElapsed = 0;				
	function checkFont() {				
		var node = document.createElement("span");				
		node.innerHTML = "giItT1WQy@!-/#";				
		node.style.position      = "absolute";				
		node.style.left          = "-1000px";				
		node.style.top           = "-1000px";				
		node.style.fontSize      = "300px";				
		node.style.fontFamily    = "sans-serif";				
		node.style.fontVariant   = "normal";				
		node.style.fontStyle     = "normal";				
		node.style.fontWeight    = "normal";				
		node.style.letterSpacing = "0";				
		document.body.appendChild(node);				
		var width = node.offsetWidth;				
		node.style.fontFamily = font+","+node.style.fontFamily;				
		var returnVal = false;				
		if((node && node.offsetWidth != width) || timeElapsed >=timeOut) {				
			obj.loadedFonts++;				
			if(interval)				
				clearInterval(interval);				
			obj.callOnLoad(font, obj.totalFonts);				
			returnVal = true;				
		}				
		if(node) {				
			node.parentNode.removeChild(node);				
			node = null;				
		}				
		timeElapsed += delay;				
		return returnVal;				
	}				
	if(!checkFont()) {				
		interval = setInterval(checkFont, delay);				
	}				
}
</script>

<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
function init() {
	canvas = document.getElementById("canvas");
	anim_container = document.getElementById("animation_container");
	dom_overlay_container = document.getElementById("dom_overlay_container");
	var comp=AdobeAn.getComposition("212CE69E997A435A93AF99233559C799");
	var lib=comp.getLibrary();
	try {
		if(!(typeof gFontsFamilies === 'undefined' || gFontsFamilies === null))
			LoadGFonts(gFontsFamilies, comp);		
		if(!(typeof totalTypekitFonts === 'undefined' || totalTypekitFonts === null)) {			
			var typekitObject = {type: 'Typekit', loadedFonts: 0, totalFonts: totalTypekitFonts, callOnLoad: lib.tfontAvailable};		
			Typekit.load({
			async: true,
			'fontactive': function(family) {
				isFontAvailable(family, typekitObject);
				}
			});
		}
	} catch(e) {};
	var loader = new createjs.LoadQueue(false);
	loader.installPlugin(createjs.Sound);
	loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
	loader.addEventListener("progress", handleLoadProgress);
	loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
	var lib=comp.getLibrary();
	loader.loadManifest(lib.properties.manifest);
}
function handleLoadProgress(evt) {
	var pct = Math.round(evt.progress * 100);
	var bar = document.getElementById("loading_bar");
	var txt = document.getElementById("loading_pct");
	if (bar) bar.style.width = pct + "%";
	if (txt) txt.textContent = pct + "%";
}
function handleFileLoad(evt, comp) {
	var images=comp.getImages();
	if (evt && (evt.item.type == "image")) { images[evt.item.id] = evt.result; }
}
function handleComplete(evt,comp) {
	var loadingScreen = document.getElementById("loading_screen");
	if (loadingScreen) loadingScreen.style.display = "none";
	//This function is always called, irrespective of the content. You can use the variable "stage" after it is created in token create_stage.
	var lib=comp.getLibrary();
	var ss=comp.getSpriteSheet();
	var queue = evt.target;
	var ssMetadata = lib.ssMetadata;
	for(i=0; i<ssMetadata.length; i++) {
		ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
	}
	exportRoot = new lib.Demo5();
	stage = new lib.Stage(canvas);
	stage.enableMouseOver();	
	//Registers the "tick" event listener.
	fnStartAnimation = function() {
		stage.addChild(exportRoot);
		createjs.Ticker.framerate = lib.properties.fps;
		createjs.Ticker.addEventListener("tick", stage);
	}	    
	//Code to support hidpi screens and responsive scaling.
	AdobeAn.makeResponsive(true,'both',true,2,[canvas,anim_container,dom_overlay_container]);
	AdobeAn.compositionLoaded(lib.properties.id);
	fnStartAnimation();
}
function playSound(id, loop, offset) {
	return createjs.Sound.play(id, {'interrupt':createjs.Sound.INTERRUPT_EARLY, 'loop': loop, 'offset': offset});}
</script>
